    body {

    .code {

      background: linear-gradient(135deg, var(--accent) 0%, #a78bfa 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 1.5rem;
    }
    .title {
      font-family: var(--font-head); font-size: 1.5rem; font-weight: 600;
      margin-bottom: .75rem;
    }
    .desc { color: var(--text2); margin-bottom: 2.5rem; }
    .actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      background: var(--accent); color: #fff; font-family: var(--font-head);
      font-weight: 600; font-size: 14px; padding: .65rem 1.5rem;
      border-radius: var(--r); text-decoration: none; transition: opacity .2s;
    }
    .btn-primary:hover { opacity: .85; }
    .btn-secondary {
      background: var(--surface); color: var(--text2); font-family: var(--font-head);
      font-weight: 500; font-size: 14px; padding: .65rem 1.5rem;
      border-radius: var(--r); text-decoration: none; border: 1px solid var(--border2);
      transition: color .2s, border-color .2s;
    }
    .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .links {
      margin-top: 3rem; display: flex; flex-wrap: wrap; gap: .5rem 1.5rem;
      justify-content: center;
    }
    .links a { font-size: 13px; color: var(--text3); text-decoration: none; transition: color .2s; }
    .links a:hover { color: var(--accent); }
    footer {
      background: var(--bg2); border-top: 1px solid var(--border);
      padding: 1.5rem; text-align: center; font-size: 12px; color: var(--text3);
    }
    footer a { color: var(--text3); text-decoration: none; }
    footer a:hover { color: var(--text); }
